name: CI

# Manual for now: GitHub Actions is blocked on this account by a billing lock ("account is locked due to a billing issue"),
# which would put a red mark on every commit. Once billing is fixed, restore:
#   push: { branches: [main] }
#   pull_request:
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # the same gate as `pnpm verify` locally: lint, clean build, typecheck (incl. doc samples), all tests incl. forge
    # invariants and the agent e2e on anvil, secret scan, public-surface checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  e2e:
    # browser tests against a local anvil chain (Playwright + axe accessibility checks)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @flying-money/web exec playwright install --with-deps chromium
      - run: pnpm verify --e2e
