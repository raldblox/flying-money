name: Bug report
description: Something doesn't work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Security problem? Don't file it here: see docs/SECURITY.md for private reporting. Never paste private keys, wallet backups or budget hand-over links."
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open https://useflyingmoney.vercel.app/…\n2. …"
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: Page or package (e.g. /shop till, @flying-money/client 0.1.0), network, browser or Node version
  - type: textarea
    id: logs
    attributes:
      label: Error messages or transaction links
      render: text
